<!-- Breadcrumb -->
<div
    class="breadcrumb-card mb-25 d-md-flex align-items-center justify-content-between"
>
    <h5 class="mb-0">تواصل معنا</h5>
</div>

<mat-card
    class="daxa-card customers-card mb-25 border-radius bg-white border-none d-block"
    [class.rtl-enabled]="themeService.isRTLEnabled()"
>
    <mat-card-header>
        <mat-card-title>
            <form class="search-box position-relative">
                <i class="material-symbols-outlined"> search </i>
                <input
                    type="text"
                    class="input-search d-block w-100 border-none outline-0"
                    placeholder="Search..."
                    (keyup)="applyFilter($event)"
                    #input
                />
            </form>
        </mat-card-title>
    </mat-card-header>

    <mat-card-content>
        <div class="customers-table">
            <div class="table-responsive">
                <table
                    mat-table
                    [dataSource]="dataSource"
                    class="mat-elevation-z8"
                >
                    <ng-container
                        *ngFor="let col of displayedColumns"
                        [matColumnDef]="col.key"
                    >
                        <th
                            mat-header-cell
                            *matHeaderCellDef
                            [style.width]="col.width"
                            class="text-nowrap"
                        >
                            {{ col.header }}
                        </th>

                        <td
                            mat-cell
                            *matCellDef="let element"
                            [style.width]="col.width"
                        >
                            {{ element[col.key] }}
                        </td>
                    </ng-container>

                    <tr
                        mat-header-row
                        *matHeaderRowDef="displayedColumnKeys"
                    ></tr>
                    <tr
                        mat-row
                        *matRowDef="let row; columns: displayedColumnKeys"
                    ></tr>

                    <tr class="mat-row" *matNoDataRow>
                        <td
                            class="mat-cell"
                            [attr.colspan]="displayedColumns.length"
                        >
                            No data available
                        </td>
                    </tr>
                </table>
            </div>

            <mat-paginator
                [pageSizeOptions]="[10, 20, 30]"
                showFirstLastButtons
            ></mat-paginator>
        </div>
    </mat-card-content>
</mat-card>
